<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MostraMI, design system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<!-- Dev-only page: npm run dev, then open /design-system/preview.html -->
<link rel="stylesheet" href="../src/styles/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; padding: 32px var(--space-gutter); background: var(--color-ink-100); color: var(--color-ink-900); font-family: var(--font-sans); }
  h1 { margin: 0; font-size: var(--font-size-display-lg); font-stretch: var(--stretch-display); font-weight: 800; line-height: .95; }
  .intro { margin: 8px 0 28px; max-width: 60ch; font-size: var(--font-size-body); line-height: 1.45; color: var(--color-ink-600); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .label { margin: 0 0 8px; font-size: var(--font-size-meta); font-weight: 600; color: var(--color-ink-600); }

  /* A specimen only uses semantic tokens, so it re-skins with the two data attributes. */
  .tile { display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: var(--radius-card); background: var(--color-bg-canvas); color: var(--color-text-primary); border: 1px solid var(--color-border-subtle); }
  .kicker { margin: 0; font-size: var(--font-size-ui); color: var(--color-text-muted); }
  .title { margin: 0; font-size: 36px; line-height: .95; font-weight: 800; font-stretch: var(--stretch-display); }
  .body { margin: 0; font-size: var(--font-size-body); line-height: 1.45; color: var(--color-text-body); }
  .card { padding: 14px; border-radius: var(--radius-card); background: var(--color-bg-surface); border: 1px solid var(--color-border-subtle); }
  .status { margin: 0 0 12px; font-size: var(--font-size-heading-sm); font-weight: 800; font-stretch: 75%; }
  .track { position: relative; height: 3px; border-radius: 2px; background: var(--color-accent-track-strong); }
  .fill { position: absolute; inset: 0 auto 0 0; width: 62%; border-radius: 2px; background: var(--color-accent-default); }
  .dot { position: absolute; top: -4px; left: 62%; width: 11px; height: 11px; margin-left: -5px; border-radius: 50%; background: var(--color-accent-strong); }
  .dates { display: flex; justify-content: space-between; margin-top: 8px; font-size: 15px; font-weight: 500; font-variant-caps: all-small-caps; font-stretch: var(--stretch-heading); letter-spacing: .06em; color: var(--color-text-muted); }
  .dates b { color: var(--color-text-primary); }
  .tag { align-self: flex-start; padding: 2px 6px; border-radius: 3px; background: var(--color-accent-subtle); color: var(--color-accent-text); font-size: var(--font-size-tag); font-weight: 600; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { height: var(--size-chip); padding: 0 14px; display: inline-flex; align-items: center; border: 1.5px solid var(--color-border-default); border-radius: var(--radius-chip); font: 500 13px var(--font-sans); }
  .chip.on { background: var(--color-bg-inverse); border-color: var(--color-border-strong); color: var(--color-text-inverse); font-weight: 600; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { height: var(--size-control); display: flex; align-items: center; justify-content: center; border-radius: var(--radius-control); border: 1.5px solid var(--color-border-strong); font: 600 15px var(--font-sans); }
  .btn.primary { background: var(--color-bg-inverse); color: var(--color-text-inverse); }
  .swatches { display: flex; gap: 4px; }
  .swatches span { flex: 1; height: 18px; border-radius: 3px; }
</style>
</head>
<body>
  <h1>Una forma, più colori</h1>
  <p class="intro">Ogni riquadro usa gli stessi elementi e solo token semantici. Cambiano due attributi: <code>data-destination</code> (app, notte, campagna, stampa) e <code>data-accent</code> (viola, acqua).</p>
  <div class="grid" id="grid"></div>

  <template id="specimen">
    <div>
      <p class="label"></p>
      <div class="tile">
        <p class="kicker">Mostra · Fotografia</p>
        <p class="title">Inge Morath. Lo sguardo laterale</p>
        <span class="tag">Abbonamento Musei</span>
        <div class="card">
          <p class="status">Chiude tra 9 giorni</p>
          <div class="track"><div class="fill"></div><div class="dot"></div></div>
          <div class="dates"><span>dic 5</span><b>feb 28</b></div>
        </div>
        <p class="body">Fabbrica del Vapore, via Procaccini 4.</p>
        <div class="chips"><span class="chip on">Aperte ora</span><span class="chip">In arrivo</span><span class="chip">Bene FAI</span></div>
        <div class="buttons"><span class="btn primary">Portami qui</span><span class="btn">Sito</span></div>
        <div class="swatches"><span style="background:var(--accent-100)"></span><span style="background:var(--accent-300)"></span><span style="background:var(--accent-500)"></span><span style="background:var(--accent-700)"></span><span style="background:var(--accent-900)"></span></div>
      </div>
    </div>
  </template>

  <script>
    // Static specimen markup cloned per combination; no app code involved.
    const destinations = ['app', 'notte', 'campagna', 'stampa'];
    const accents = ['viola', 'acqua'];
    const grid = document.getElementById('grid');
    const tpl = document.getElementById('specimen');
    for (const d of destinations) {
      for (const a of accents) {
        const node = tpl.content.firstElementChild.cloneNode(true);
        node.querySelector('.label').textContent = `${d} · ${a}`;
        const tile = node.querySelector('.tile');
        tile.dataset.destination = d;
        tile.dataset.accent = a;
        grid.append(node);
      }
    }
  </script>
</body>
</html>
